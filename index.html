<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แจ้งปัญหาคอมพิวเตอร์ / IT</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Sarabun', Tahoma, sans-serif;
      background: linear-gradient(135deg, #eef2ff 0%, #f7f9fc 100%);
      margin: 0; padding: 24px 16px; min-height: 100vh;
      display: flex; justify-content: center;
    }
    .card {
      background: #fff; max-width: 480px; width: 100%;
      border-radius: 16px; padding: 28px 24px;
      box-shadow: 0 10px 30px rgba(26,115,232,0.12);
    }
    h1 { font-size: 20px; color: #1a237e; margin: 0 0 4px; }
    p.sub { color: #667; font-size: 13px; margin: 0 0 22px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #333; margin: 16px 0 6px; }
    input, select, textarea {
      width: 100%; padding: 11px 12px; border: 1px solid #d7dce3;
      border-radius: 8px; font-size: 14px; font-family: inherit; background: #fafbfc;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #1a73e8; background: #fff; }
    textarea { resize: vertical; min-height: 90px; }
    .urgency-group { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 6px; }
    .urgency-group input { display: none; }
    .urgency-group label.opt {
      text-align: center; padding: 9px 4px; border-radius: 8px; font-size: 12px;
      border: 1px solid #d7dce3; cursor: pointer; margin: 0; color: #555; user-select: none;
    }
    .urgency-group input:checked + label.opt.low { background: #e6f4ea; border-color: #34a853; color: #1e7e34; }
    .urgency-group input:checked + label.opt.med { background: #fef7e0; border-color: #fbbc04; color: #916b00; }
    .urgency-group input:checked + label.opt.high { background: #fce8e6; border-color: #ea4335; color: #b3261e; }
    .urgency-group input:checked + label.opt.urgent { background: #ea4335; border-color: #ea4335; color: #fff; font-weight: 700; }
    button {
      width: 100%; margin-top: 24px; padding: 13px; border: none; border-radius: 10px;
      background: #1a73e8; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background .15s;
    }
    button:hover { background: #1558b0; }
    button:disabled { background: #a9bde0; cursor: not-allowed; }
    .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 13px; display: none; }
    .msg.ok { background: #e6f4ea; color: #1e7e34; display: block; }
    .msg.err { background: #fce8e6; color: #b3261e; display: block; }
    .footer-link { text-align: center; margin-top: 18px; }
    .footer-link a { font-size: 12px; color: #8a94a6; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🖥️ แจ้งปัญหาคอมพิวเตอร์ / IT</h1>
    <p class="sub">กรอกแบบฟอร์มด้านล่าง ทีม IT จะดำเนินการตรวจสอบ Ticket ที่เข้ามา</p>

    <form id="ticketForm">
      <label for="name">ชื่อ-นามสกุลผู้แจ้ง</label>
      <input type="text" id="name" required placeholder="เช่น สมชาย ใจดี">

      <label for="department">แผนก / หน่วยงาน</label>
      <input type="text" id="department" required placeholder="เช่น ฝ่ายบัญชี">

      <label for="problem">รายละเอียดปัญหา</label>
      <textarea id="problem" required placeholder="อธิบายอาการหรือปัญหาที่พบ"></textarea>

      <label>ความเร่งด่วน</label>
      <div class="urgency-group">
        <input type="radio" name="urgency" id="u1" value="ต่ำ">
        <label class="opt low" for="u1">ต่ำ</label>

        <input type="radio" name="urgency" id="u2" value="ปานกลาง" checked>
        <label class="opt med" for="u2">ปานกลาง</label>

        <input type="radio" name="urgency" id="u3" value="สูง">
        <label class="opt high" for="u3">สูง</label>

        <input type="radio" name="urgency" id="u4" value="ด่วนมาก">
        <label class="opt urgent" for="u4">ด่วนมาก</label>
      </div>

      <button type="submit" id="submitBtn">ส่งแจ้งปัญหา</button>
      <div id="resultMsg" class="msg"></div>
    </form>

    <div class="footer-link"><a href="dashboard.html">เข้าสู่แดชบอร์ดทีม IT →</a></div>
  </div>

  <script>
    // ==== แก้ตรงนี้: ใส่ URL ของ Apps Script Web App (ลงท้ายด้วย /exec) ====
    const API_URL = 'https://script.google.com/macros/s/AKfycbwsxXCZRi6-E_2wIWcqYKP8y2eaqttf-WCUKflhJ5hIVVtrl-5HVgDHU6Sv_oZjEU9m/exec';

    const form = document.getElementById('ticketForm');
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('resultMsg');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const urgencyEl = form.querySelector('input[name="urgency"]:checked');
      const data = {
        name: document.getElementById('name').value.trim(),
        department: document.getElementById('department').value.trim(),
        problem: document.getElementById('problem').value.trim(),
        urgency: urgencyEl ? urgencyEl.value : 'ปานกลาง'
      };

      btn.disabled = true;
      btn.textContent = 'กำลังส่ง...';
      msg.className = 'msg';
      msg.textContent = '';

      fetch(API_URL, {
        method: 'POST',
        // ใช้ text/plain เพื่อเลี่ยง CORS preflight (Apps Script ไม่รองรับ OPTIONS)
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'submitTicket', data: data })
      })
        .then(function (res) { return res.json(); })
        .then(function (res) {
          btn.disabled = false;
          btn.textContent = 'ส่งแจ้งปัญหา';
          if (res && res.success) {
            msg.className = 'msg ok';
            msg.textContent = '✅ แจ้งปัญหาสำเร็จ! หมายเลข Ticket: ' + res.ticketId;
            form.reset();
            document.getElementById('u2').checked = true;
          } else {
            msg.className = 'msg err';
            msg.textContent = '❌ ' + (res && res.error ? res.error : 'เกิดข้อผิดพลาด กรุณาลองใหม่');
          }
        })
        .catch(function (err) {
          btn.disabled = false;
          btn.textContent = 'ส่งแจ้งปัญหา';
          msg.className = 'msg err';
          msg.textContent = '❌ เชื่อมต่อ API ไม่ได้: ' + err.message;
        });
    });
  </script>
</body>
</html>
